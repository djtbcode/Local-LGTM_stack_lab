server:
  retention: "7d"

  persistentVolume:
    enabled: true
    size: 10Gi

  resources:
    requests:
      cpu: 250m
      memory: 512Mi
    limits:
      cpu: 1000m
      memory: 2Gi

  extraArgs:
    web.enable-remote-write-receiver: null

alertmanager:
  enabled: false

prometheus-pushgateway:
  enabled: false
    
