apiVersion: apps/v1
kind: Deployment
metadata:
  name: otel-demo
  namespace: demo
spec:
  replicas: 1

  selector:
    matchLabels:
      app: otel-demo

  template:
    metadata:
      labels:
        app: otel-demo

    spec:
      containers:
        - name: otel-demo
          image: otel-demo:0.1
          imagePullPolicy: IfNotPresent

          ports:
            - containerPort: 8080

          env:
            - name: OTEL_SERVICE_NAME
              value: otel-demo

            - name: OTEL_EXPORTER_OTLP_ENDPOINT
              value: http://k8s-monitoring-alloy-receiver.observability.svc.cluster.local:4318

            - name: OTEL_EXPORTER_OTLP_PROTOCOL
              value: http/protobuf

            - name: OTEL_TRACES_EXPORTER
              value: otlp

            - name: OTEL_METRICS_EXPORTER
              value: none

            - name: OTEL_LOGS_EXPORTER
              value: none

            - name: OTEL_RESOURCE_ATTRIBUTES
              value: deployment.environment.name=homelab,service.version=0.1

---
apiVersion: v1
kind: Service
metadata:
  name: otel-demo
  namespace: demo
spec:
  selector:
    app: otel-demo

  ports:
    - port: 8080
      targetPort: 8080
